schema: spec-driven

context: |
  Project: NL Design
  Repo: ConductionNL/nldesign
  Type: Nextcloud administration app (PHP backend and vanilla JS)
  Current product: manifest-backed, statically gated profile selection
  Current inventory: 40 manifest entries and 40 packaged stylesheets
  Selectable inventory: 8 entries with status ready and projection nextcloud-core-v1
  Runtime state: app-scoped IAppConfig, no own database tables
  Font: self-hosted Fira Sans build output, SIL OFL 1.1
  App licence: EUPL-1.2

  Load-bearing profile plane:
    token-sets.json -> TokenSetService -> ProfileStateService -> TemplateStylesListener

  Stylesheet order:
    1. css/fonts.css
    2. css/tokens/{profile}.css
    3. css/theme.css

  Deferred/non-load-bearing:
    - automatic Nextcloud Theming mutation
    - token editor and arbitrary local overrides
    - import/export and apply-token dialog
    - unregistered private compatibility prototype

rules:
  proposal:
    - Preserve the profile plane when optional compatibility code is removed
    - State whether a capability is implemented, reachable, tested, and released
    - Treat identity rights, provenance, conformance, and compatibility as separate evidence
  specs:
    - Use GIVEN/WHEN/THEN scenarios
    - Specify revision, failure, rollback, and migration behavior
    - Never expose arbitrary app ids, config keys, service names, selectors, or server paths
  design:
    - Runtime package directories are immutable
    - All profile tokens use the --nldesign-* namespace
    - Private OCA\Theming references stay in the compatibility infrastructure boundary
    - Accessibility preferences outrank branding
    - Source-only entries remain unavailable until they carry a minimal validated projection
  tasks:
    - Run all local quality and dependency gates
    - Test exact Nextcloud majors and named app surfaces before compatibility claims
    - Measure projected colour pairs in light, dark, and high-contrast modes
