name: Code Quality

on:
  push:
    branches: [main, development, feature/**, bugfix/**, hotfix/**]
  pull_request:
    branches: [main, beta, development]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege for the called quality pipeline: the Quality Report job
# posts a sticky PR comment (issues/pull-requests write); everything else
# only reads the checkout.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  quality:
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: nldesign
      php-version: "8.3"
      enable-psalm: false
      enable-phpstan: false
      enable-phpcs: false
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-sbom: true
      enable-phpunit: true
