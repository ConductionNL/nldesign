name: Code Quality

on:
  push:
    branches: [main, beta, development]
  pull_request:
    branches: [main, beta, development]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install verified actionlint binary
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          ARCHIVE="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --max-filesize 5242880 \
            --output "$ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: Lint GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/actionlint"

  php:
    name: PHP ${{ matrix.php }} quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            coverage: pcov
          - php: '8.5'
            coverage: none

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, iconv, intl, dom, filter, gd, json, posix, zip
          tools: composer:2.10.2@sha256:5ee7125f8a30a34d246cefdc0bc85b8a783b28f2aec968994118512350d28027
          coverage: ${{ matrix.coverage }}
        env:
          fail-fast: true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Validate Nextcloud app metadata schema
        if: matrix.php == '8.2'
        run: |
          SCHEMA="$RUNNER_TEMP/nextcloud-app-info.xsd"
          curl --fail --location --proto '=https' --tlsv1.2 --max-filesize 1048576 \
            --output "$SCHEMA" https://apps.nextcloud.com/schema/apps/info.xsd
          # PHP, not the shell, expands variables in this single-quoted code.
          # shellcheck disable=SC2016
          php -r '$document = new DOMDocument(); exit($document->load("appinfo/info.xml") && $document->schemaValidate($argv[1]) ? 0 : 1);' "$SCHEMA"

      - name: Audit Composer dependencies
        run: composer audit --locked

      - name: Run PHP quality suite
        run: composer check

      - name: Enforce PHP line coverage
        if: matrix.php == '8.2'
        run: composer check:coverage

  frontend:
    name: Node.js ${{ matrix.node }} frontend, assets, and architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x', '26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit all npm dependencies
        run: npm audit --audit-level=high

      - name: Validate JavaScript, CSS, architecture, and profiles
        run: npm test

      - name: Rebuild bundled assets
        run: npm run build

      - name: Verify generated assets are current
        # `git diff --exit-code` cannot see untracked files, so a generated asset
        # that was never committed reads as "no change". That hid the bundled
        # fonts' OFL notice: build-fonts.js emits css/fonts/OFL-1.1.txt and
        # validates it as required, but it was absent from source control, so a
        # git checkout shipped the fonts with no licence. --porcelain reports
        # modified and untracked alike.
        run: |
          status=$(git status --porcelain -- css/fonts css/fonts.css)
          if [ -n "$status" ]; then
            echo "Generated assets are not current, or are not committed:"
            echo "$status"
            exit 1
          fi

  ocp-contract:
    name: Nextcloud ${{ matrix.nextcloud }} OCP contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        nextcloud: ['32', '33', '34']

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, dom, filter, gd, json, posix, zip
          tools: composer:2.10.2@sha256:5ee7125f8a30a34d246cefdc0bc85b8a783b28f2aec968994118512350d28027
          coverage: none
        env:
          fail-fast: true

      - name: Resolve target OCP contract
        run: >-
          composer require --dev "nextcloud/ocp:^${{ matrix.nextcloud }}.0"
          --with-all-dependencies --no-interaction --no-progress --prefer-dist

      - name: Validate resolved dependencies
        run: |
          composer validate --strict
          composer audit --locked

      - name: Run PHP quality suite
        run: composer check

  secrets:
    name: Repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks binary
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          ARCHIVE="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP" gitleaks

      - name: Scan complete repository history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts='--all'
