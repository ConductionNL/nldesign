name: Code Quality

on:
  pull_request:
    branches: [main, master, development]

concurrency:
  group: quality-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  php-checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    # Matrix of 6 legs (PHP Lint, PHPCS, PHPMD, Psalm, PHPStan, PHPUnit). The
    # equivalent shared PHP Quality legs were observed at max 4.0 min across
    # 1497 executions, and the PHPUnit leg is the slow one (measured up to
    # 18.9 min while succeeding elsewhere in the fleet). 20 min covers every
    # leg with margin; the point is to catch a hang, not to enforce speed.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: "PHP Lint", command: "composer lint" }
          - { name: "PHPCS", command: "./vendor/bin/phpcs --standard=phpcs.xml" }
          - { name: "PHPMD", command: "./vendor/bin/phpmd lib text phpmd.xml" }
          - { name: "Psalm", command: "./vendor/bin/psalm --threads=1 --no-cache --output-format=github" }
          - { name: "PHPStan", command: "./vendor/bin/phpstan analyse --memory-limit=1G" }
          - { name: "PHPUnit", command: "./vendor/bin/phpunit --colors=always" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, intl, dom, filter, gd, json, posix, zip, soap
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}
  css-quality:
    name: CSS Quality
    runs-on: ubuntu-latest
    # Stylelint over the token CSS. The shared Vue Quality (stylelint) leg was
    # observed at max 2.1 min across 494 executions.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stylelint
        run: npm run stylelint
