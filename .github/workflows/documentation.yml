name: Documentation

on:
  push:
    branches: [main, beta, development]
  pull_request:
    branches: [main, beta, development]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified build to GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x', '26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: docusaurus/package-lock.json

      - name: Install dependencies
        working-directory: docusaurus
        run: npm ci --ignore-scripts

      - name: Validate documentation assets
        working-directory: docusaurus
        run: npm run check:assets

      - name: Audit shipped dependencies
        working-directory: docusaurus
        run: npm run audit:runtime

      - name: Audit all build dependencies
        working-directory: docusaurus
        run: npm run audit:build

      - name: Build
        working-directory: docusaurus
        run: npm run build

      - name: Verify output
        run: test -f docusaurus/build/index.html

      - name: Upload Pages artifact
        if: >-
          github.event_name == 'workflow_dispatch'
          && inputs.deploy
          && github.ref == 'refs/heads/main'
          && matrix.node == '24.x'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docusaurus/build

  deploy:
    name: Deploy documentation
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.deploy
      && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
