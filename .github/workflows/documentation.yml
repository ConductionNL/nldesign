name: Documentation

on:
  # `development` is where the work lands. This used to trigger on a
  # `documentation` branch that exists but nobody updates, which is why PR
  # #392 exists at all — a manual "sync development into documentation" is a
  # symptom of the trigger being wrong, not a fix for it.
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  deploy:
    uses: ConductionNL/.github/.github/workflows/documentation.yml@main
    # A called workflow receives NO secrets from its caller unless they are
    # passed explicitly or inherited — `with:` carries inputs, never secrets.
    # Without this line `secrets.CF_API_TOKEN` is EMPTY inside the callee, so
    # its "Publish to the Cloudflare Worker" step skips itself on its own
    # guard and the run finishes GREEN having written only gh-pages, which
    # nothing serves. The live site never changes and no check goes red to
    # say so — the exact failure mode the pinned inputs below guard against,
    # arriving one layer earlier.
    secrets: inherit
    with:
      cname: thematiq.conduction.nl

      # EVERY host this site answers on, in FULL: wrangler reconciles the
      # worker's triggers against this list, so a host omitted here is
      # REMOVED from the worker and goes dark. Both were attached as custom
      # domains on 2026-08-23 and both serve 200.
      docs-hosts: nldesign.conduction.nl,thematiq.conduction.nl

      # The worker that ALREADY holds both custom domains. Without this the
      # callee derives the name from `cname` — `thematiq-docs` — which does
      # not exist. Deploying that would create a SECOND worker while both
      # custom domains keep routing to `nldesign-docs`: every deploy green,
      # reaching nobody. Renaming the worker is a Cloudflare-side move, not
      # something this file can perform.
      worker-name: nldesign-docs
