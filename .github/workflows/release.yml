name: Publish prerelease

# Publish an installable, checksum-backed GitHub prerelease from the same
# reusable package job used for release candidates. Stable and App Store
# publication remain deliberately separate, human-authorized work.
#
# The tag is a trigger, not a source of truth. Packaging re-derives the version
# from appinfo/info.xml and cross-checks package.json and package-lock.json. The
# tag must agree with all three before any release is created.
on:
  push:
    tags:
      - 'v*.*.*-alpha*'
      - 'v*.*.*-beta*'
      - 'v*.*.*-rc*'

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package
    # Reuses the release-candidate job rather than repeating its gates, so the
    # published archive is the one that passed them.
    uses: ./.github/workflows/package-release.yml

  publish:
    name: Publish GitHub prerelease
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed only to create the prerelease and upload its two assets.
      contents: write

    steps:
      - name: Download the verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nldesign-${{ needs.package.outputs.version }}

      - name: Check the tag matches the packaged version
        env:
          PACKAGED: ${{ needs.package.outputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in
            *-alpha[0-9]*|*-beta[0-9]*|*-rc[0-9]*) ;;
            *)
              echo "Tag $GITHUB_REF_NAME is not a supported prerelease tag."
              exit 1
              ;;
          esac
          if [ "$TAG" != "$PACKAGED" ]; then
            echo "Tag $GITHUB_REF_NAME does not match appinfo version $PACKAGED."
            echo "Bump all package metadata together, or create the correct tag."
            exit 1
          fi

      - name: Verify the checksum before publishing
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          sha256sum --check --strict "nldesign-${VERSION}.tar.gz.sha256"
          ls -l "nldesign-${VERSION}.tar.gz"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: nldesign ${{ needs.package.outputs.version }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Unsigned prerelease for installation and integration testing.
            This is not a Nextcloud App Store release.
          files: |
            nldesign-${{ needs.package.outputs.version }}.tar.gz
            nldesign-${{ needs.package.outputs.version }}.tar.gz.sha256
